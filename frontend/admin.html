<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roselle - Painel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header></header>
  <main>
    <h1>Painel</h1>
    <div id="msg" class="msg" hidden></div>

    <section>
      <h2>Produtos</h2>
      <div id="products" class="table-wrap"></div>
      <div id="products-pager" class="pager"></div>
      <form id="product-form" class="card">
        <h3 id="product-title">Novo produto</h3>
        <div class="row">
          <input name="name" placeholder="Nome" required>
          <input name="price" type="number" step="0.01" min="0" placeholder="Preço" required>
          <input name="stock" type="number" min="0" placeholder="Estoque" required>
          <select name="category_id" required></select>
          <select name="is_active"><option value="1">Ativo</option><option value="0">Inativo</option></select>
        </div>
        <label>Descrição</label><textarea name="description"></textarea>
        <label>Imagem</label><input type="file" name="image" accept="image/*">
        <p><button>Salvar produto</button> <button type="button" class="secondary" id="product-cancel">Limpar</button></p>
      </form>
    </section>

    <section>
      <h2>Categorias</h2>
      <div id="categories" class="table-wrap"></div>
      <form id="category-form" class="card">
        <h3 id="category-title">Nova categoria</h3>
        <label>Nome</label><input name="name" required>
        <label>Descrição</label><input name="description">
        <p><button>Salvar categoria</button> <button type="button" class="secondary" id="category-cancel">Limpar</button></p>
      </form>
    </section>

    <section>
      <h2>Pedidos</h2>
      <select id="order-status">
        <option value="">Todos os status</option>
        <option value="pending">Aguardando pagamento</option>
        <option value="paid">Pago</option>
        <option value="shipped">Enviado</option>
        <option value="delivered">Entregue</option>
        <option value="cancelled">Cancelado</option>
      </select>
      <div id="admin-orders" class="table-wrap"></div>
      <div id="orders-pager" class="pager"></div>
    </section>
  </main>
  <script type="module" src="js/admin-products.js"></script>
  <script type="module" src="js/admin-categories.js"></script>
  <script type="module" src="js/admin-orders.js"></script>
</body>
</html>
